<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crece en Casa</title>
<style>
/* Layout: el diseño original como imagen exacta, con zonas de enlace reales sobre cada botón "Acceder". Look único. */
:root{ --bg:#efe4cb; --green:#0f3a22; --gold:#f1d98f; --cream:#fdf6e3; color-scheme:light }
*{box-sizing:border-box}
html,body{min-height:100%; height:100%}
body{
  margin:0;
  background:radial-gradient(70% 50% at 50% 30%, #fbf3e2 0%, var(--bg) 70%);
  display:flex; justify-content:center; align-items:center; min-height:100vh; min-height:100dvh; position:relative; overflow-x:hidden;
  padding-left:max(0px, env(safe-area-inset-left,0px));
  padding-right:max(0px, env(safe-area-inset-right,0px));
  padding-block:0;
  font-family:"Segoe UI", Arial, sans-serif;
}
.poster{position:relative; z-index:1; width:100%; max-width:1182px; aspect-ratio:1182/1330; max-height:100vh; max-width:min(1182px, calc(100vh * 1182 / 1330))}
.poster img{display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none}
.hot{
  position:absolute; top:73.2%; height:5.65%;
  border-radius:999px; display:block; text-decoration:none;
  transition:box-shadow .2s ease, background .2s ease, transform .2s ease;
}
.hot:hover{background:rgba(255,255,255,.12); box-shadow:0 0 0 3px rgba(241,217,143,.85), 0 0 22px 4px rgba(241,217,143,.55); transform:translateY(-1px)}
.hot:active{transform:translateY(1px); background:rgba(0,0,0,.08)}
.hot:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.h1{left:11.1%;  width:22.0%}
.h2{left:39.3%;  width:21.85%}
.h3{left:67.2%;  width:21.95%}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--green); color:var(--cream); border:1px solid var(--gold); padding:12px 18px; border-radius:12px; font-size:15px; z-index:20; max-width:calc(100% - 32px); text-align:center}
.backdrop{position:fixed; inset:-80px; z-index:0; background-size:cover; background-position:center; filter:blur(40px) saturate(1.1); transform:scale(1.2)}
.veil{position:fixed; inset:0; z-index:0; background:radial-gradient(120% 60% at 50% 50%, rgba(251,243,226,.15) 0%, rgba(251,243,226,.55) 100%)}
@media (max-width:700px), (max-aspect-ratio:1/1){
  .poster{max-height:none; max-width:100%;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
}
@media (prefers-reduced-motion:reduce){ .hot{transition:none} .hot:hover,.hot:active{transform:none} }
</style>
</head>

<script>
/* ===== ENLACES: reemplaza cada "#" por la URL real ===== */
const ENLACES = {
  plataforma: "#",   // Explora la Plataforma
  video:      "#",   // Video Instructivo
  jardin:     "#"    // Nuestro Jardín
};
/* ====================================================== */
const posterImg = document.querySelector('.poster img');
document.querySelectorAll('.backdrop').forEach(el => el.style.backgroundImage = 'url("' + posterImg.src + '")');
const toast = document.getElementById('toast');
let t;
document.querySelectorAll('.hot[data-key]').forEach(a => {
  const url = ENLACES[a.dataset.key];
  const ok = url && /^https?:\/\//i.test(url);
  if (ok) a.href = url;
  a.addEventListener('click', e => {
    if (!ok) {
      e.preventDefault();
      toast.hidden = false; clearTimeout(t);
      t = setTimeout(() => toast.hidden = true, 2600);
    }
  });
});
