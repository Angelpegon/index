<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Crece en Casa</title>
    <style>
        /* Layout: el diseño original como imagen exacta, con zonas de enlace reales sobre cada botón "Acceder". Look único. */
        :root {
            --bg: #efe4cb;
            --green: #0f3a22;
            --gold: #f1d98f;
            --cream: #fdf6e3;
            color-scheme: light
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            min-height: 100%;
            height: 100%
        }

        body {
            margin: 0;
            background: radial-gradient(70% 50% at 50% 30%, #fbf3e2 0%, var(--bg) 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            overflow-x: hidden;
            padding-left: max(0px, env(safe-area-inset-left, 0px));
            padding-right: max(0px, env(safe-area-inset-right, 0px));
            padding-block: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body.is-player-open {
            overflow: hidden
        }

        .poster {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 914px;
            aspect-ratio: 914 / 1024;
            max-height: 100vh;
            max-height: 100dvh;
            max-width: min(914px, calc(100vh * 914 / 1024), calc(100dvh * 914 / 1024))
        }

        .poster img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none
        }

        .hot {
            position: absolute;
            top: 71.7%;
            height: 5.6%;
            border-radius: 999px;
            display: block;
            text-decoration: none;
            transition: box-shadow .2s ease, background .2s ease, transform .2s ease;
        }

        .hot:hover {
            background: rgba(255, 255, 255, .12);
            box-shadow: 0 0 0 3px rgba(241, 217, 143, .85), 0 0 22px 4px rgba(241, 217, 143, .55);
            transform: translateY(-1px)
        }

        .hot:active {
            transform: translateY(1px);
            background: rgba(0, 0, 0, .08)
        }

        .hot:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px
        }

        .h1 {
            left: 9.2%;
            width: 23.8%
        }

        .h2 {
            left: 38.3%;
            width: 23.6%
        }

        .h3 {
            left: 67.2%;
            width: 23.7%
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--green);
            color: var(--cream);
            border: 1px solid var(--gold);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            z-index: 20;
            max-width: calc(100% - 32px);
            text-align: center
        }

        .backdrop {
            position: fixed;
            inset: -80px;
            z-index: 0;
            background-size: cover;
            background-position: center;
            filter: blur(40px) saturate(1.1);
            transform: scale(1.2)
        }

        .veil {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(120% 60% at 50% 50%, rgba(251, 243, 226, .15) 0%, rgba(251, 243, 226, .55) 100%)
        }

        .player-overlay {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
            background: rgba(15, 58, 34, .55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .25s ease, visibility .25s ease
        }

        .player-overlay.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto
        }

        .player-panel {
            width: min(920px, 100%);
            background: linear-gradient(180deg, #fffaf0 0%, var(--cream) 100%);
            border: 3px solid var(--gold);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(15, 58, 34, .35), 0 0 0 1px rgba(241, 217, 143, .35) inset;
            padding: 18px 18px 20px;
            transform: translateY(12px) scale(.98);
            transition: transform .25s ease
        }

        .player-overlay.is-open .player-panel {
            transform: none
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            padding: 0 4px
        }

        .player-title {
            margin: 0;
            color: var(--green);
            font-size: clamp(1.05rem, 2.5vw, 1.35rem);
            font-weight: 700;
            letter-spacing: .01em;
            line-height: 1.25
        }

        .player-close {
            flex: none;
            width: 42px;
            height: 42px;
            border: 2px solid var(--gold);
            border-radius: 999px;
            background: var(--green);
            color: var(--cream);
            font-size: 1.35rem;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background .2s ease, transform .2s ease, box-shadow .2s ease
        }

        .player-close:hover {
            background: #164f30;
            box-shadow: 0 0 0 3px rgba(241, 217, 143, .55)
        }

        .player-close:active {
            transform: translateY(1px)
        }

        .player-close:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }

        .player-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 18px;
            overflow: hidden;
            background: #0f3a22;
            box-shadow: 0 10px 28px rgba(15, 58, 34, .22)
        }

        .player-frame video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
            cursor: pointer
        }

        .player-play {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer
        }

        .player-play[hidden] {
            display: none !important
        }

        .player-play__icon {
            width: 72px;
            height: 72px;
            border-radius: 999px;
            background: var(--green);
            border: 3px solid var(--gold);
            box-shadow: 0 10px 28px rgba(15, 58, 34, .35);
            display: grid;
            place-items: center;
            transition: transform .15s ease, background .15s ease
        }

        .player-play__icon::before {
            content: "";
            width: 0;
            height: 0;
            margin-left: 4px;
            border-style: solid;
            border-width: 12px 0 12px 20px;
            border-color: transparent transparent transparent var(--cream)
        }

        .player-play:hover .player-play__icon,
        .player-play:focus-visible .player-play__icon {
            background: #164f30;
            transform: scale(1.05)
        }

        .player-play:focus-visible {
            outline: none
        }

        .player-play:focus-visible .player-play__icon {
            outline: 3px solid var(--gold);
            outline-offset: 3px
        }

        .player-fallback {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            text-align: center;
            color: var(--cream);
            background: radial-gradient(60% 50% at 60% 40%, #3a1a3a 0%, #0f3a22 70%)
        }

        .player-fallback.is-visible {
            display: flex
        }

        .player-fallback p {
            margin: 0;
            max-width: 28rem;
            font-size: .95rem;
            line-height: 1.4
        }

        @media (max-width:700px),
        (max-aspect-ratio:1/1) {
            .poster {
                max-height: none;
                max-width: 100%;
                -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 7%, #000 93%, transparent 100%);
                mask-image: linear-gradient(180deg, transparent 0, #000 7%, #000 93%, transparent 100%)
            }

            .player-panel {
                border-radius: 22px;
                padding: 14px 14px 16px
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .hot,
            .player-overlay,
            .player-panel,
            .player-close,
            .player-play__icon {
                transition: none
            }

            .hot:hover,
            .hot:active {
                transform: none
            }

            .player-overlay.is-open .player-panel {
                transform: none
            }
        }
    </style>
</head>

<body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>
    <main class="poster">
        <img src="crece-en-casa-poster.jpg"
            alt="Crece en Casa. Pequeñas acciones, grandes conversaciones. Explora, aprende y descubre herramientas prácticas para el acompañamiento en casa. Tres opciones: Explora la Plataforma, Video Instructivo y Nuestro Jardín."
            width="914" height="1024">
        <a class="hot h1" data-key="plataforma" href="#" target="_blank" rel="noopener"><span class="sr">Acceder a
                Explora la Plataforma</span></a>
        <a class="hot h2" data-key="video" href="#" role="button"><span class="sr">Ver Video
                Instructivo</span></a>
        <a class="hot h3" data-key="jardin" href="#" role="button"><span class="sr">Ver Nuestro
                Jardín</span></a>
    </main>

    <div class="player-overlay" id="player-overlay" hidden>
        <div class="player-panel" role="dialog" aria-modal="true" aria-labelledby="player-title">
            <div class="player-header">
                <h2 class="player-title" id="player-title">Video</h2>
                <button type="button" class="player-close" id="player-close" aria-label="Cerrar video">&times;</button>
            </div>
            <div class="player-frame">
                <video id="player-video" playsinline preload="metadata"></video>
                <button type="button" class="player-play" id="player-play" hidden aria-label="Reproducir">
                    <span class="player-play__icon" aria-hidden="true"></span>
                </button>
                <div class="player-fallback" id="player-fallback" hidden>
                    <p>No se pudo cargar el video.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" hidden>Este enlace aún no está configurado.</div>

    <script>
        /* ===== CONFIG ===== */
        const ENLACES = {
            plataforma: "https://crece-en-casa.onrender.com/"
        };
        /* Archivos locales tal cual (sin reencode). Nombres URL-safe. */
        const VIDEOS = {
            video: {
                src: "instructivo.mp4",
                title: "Video Instructivo"
            },
            jardin: {
                src: "nuestro-jardin.mp4",
                title: "Nuestro Jardín"
            }
        };
        /* ================== */

        const posterImg = document.querySelector('.poster img');
        document.querySelectorAll('.backdrop').forEach(el => el.style.backgroundImage = 'url("' + posterImg.src + '")');

        const toast = document.getElementById('toast');
        const overlay = document.getElementById('player-overlay');
        const titleEl = document.getElementById('player-title');
        const videoEl = document.getElementById('player-video');
        const playBtn = document.getElementById('player-play');
        const fallback = document.getElementById('player-fallback');
        const closeBtn = document.getElementById('player-close');
        let toastTimer;
        let lastFocus = null;

        function syncPlayUi() {
            const show = videoEl.paused || videoEl.ended;
            playBtn.hidden = !show;
            playBtn.setAttribute("aria-label", show ? "Reproducir" : "Pausar");
        }

        function stopVideo() {
            videoEl.pause();
            videoEl.removeAttribute("src");
            videoEl.load();
            playBtn.hidden = true;
        }

        function togglePlay() {
            if (!videoEl.src && !videoEl.currentSrc) return;
            if (videoEl.paused || videoEl.ended) {
                const p = videoEl.play();
                if (p && typeof p.catch === "function") p.catch(() => syncPlayUi());
            } else {
                videoEl.pause();
            }
            syncPlayUi();
        }

        function showFallback() {
            stopVideo();
            videoEl.style.display = "none";
            playBtn.hidden = true;
            fallback.hidden = false;
            fallback.classList.add("is-visible");
        }

        function hideFallback() {
            fallback.classList.remove("is-visible");
            fallback.hidden = true;
            videoEl.style.display = "block";
        }

        function openPlayer(key, trigger) {
            const video = VIDEOS[key];
            if (!video || !video.src) {
                toast.hidden = false;
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.hidden = true, 2600);
                return;
            }
            lastFocus = trigger || document.activeElement;
            titleEl.textContent = video.title;
            hideFallback();
            videoEl.setAttribute("aria-label", video.title);
            videoEl.src = video.src;
            playBtn.hidden = true;
            const play = () => {
                const p = videoEl.play();
                if (p && typeof p.catch === "function") {
                    p.then(syncPlayUi).catch(() => syncPlayUi());
                } else {
                    syncPlayUi();
                }
            };
            videoEl.addEventListener("loadeddata", play, { once: true });
            videoEl.addEventListener("error", () => showFallback(), { once: true });
            overlay.hidden = false;
            void overlay.offsetWidth;
            overlay.classList.add("is-open");
            document.body.classList.add("is-player-open");
            closeBtn.focus();
        }

        function closePlayer() {
            if (!overlay.classList.contains("is-open") && overlay.hidden) return;
            overlay.classList.remove("is-open");
            document.body.classList.remove("is-player-open");
            stopVideo();
            hideFallback();
            const finish = () => {
                overlay.hidden = true;
                if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
                lastFocus = null;
            };
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                finish();
            } else {
                setTimeout(finish, 250);
            }
        }

        videoEl.addEventListener("click", togglePlay);
        playBtn.addEventListener("click", e => {
            e.stopPropagation();
            togglePlay();
        });
        videoEl.addEventListener("play", syncPlayUi);
        videoEl.addEventListener("pause", syncPlayUi);
        videoEl.addEventListener("ended", syncPlayUi);

        document.querySelectorAll('.hot[data-key]').forEach(a => {
            const key = a.dataset.key;
            if (VIDEOS[key]) {
                a.addEventListener("click", e => {
                    e.preventDefault();
                    openPlayer(key, a);
                });
                return;
            }
            const url = ENLACES[key];
            const ok = url && /^https?:\/\//i.test(url);
            if (ok) a.href = url;
            a.addEventListener("click", e => {
                if (!ok) {
                    e.preventDefault();
                    toast.hidden = false;
                    clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => toast.hidden = true, 2600);
                }
            });
        });

        closeBtn.addEventListener("click", closePlayer);
        overlay.addEventListener("click", e => {
            if (e.target === overlay) closePlayer();
        });
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && overlay.classList.contains("is-open")) {
                e.preventDefault();
                closePlayer();
            }
        });
    </script>
</body>

</html>
